name: Build Windows Executable (.exe)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install HUD dependencies
        working-directory: ./hud
        run: npm ci

      - name: Run HUD tests
        working-directory: ./hud
        run: |
          npm run typecheck
          npm test

      - name: Build Windows Executable (.exe)
        working-directory: ./hud
        run: npm run dist:win

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: nonchalant-hud-windows
          path: |
            hud/release/*.exe
          if-no-files-found: error

      - name: Create GitHub Release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: hud/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
